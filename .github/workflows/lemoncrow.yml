name: LemonCrow
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: lemoncrow-lab/lemoncrow@MIRROR_SHA
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
